<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pegel Family Dental Intercom</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Roboto:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Outfit:wght@400;600;700&family=Lexend+Deca:wght@400;600;700&family=Roboto+Mono:wght@400;600;700&family=Playfair+Display:wght@400;700;800&family=Roboto+Slab:wght@400;600;700&family=Merriweather:wght@400;700&family=Comic+Relief&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#f4f6f9;--text-color:#333;--subtitle-color:#555;--card-bg:#fff;--panel-bg:#fff;--panel-border:#ddd;--btn-bg:#e0e0e0;--btn-text:#333;--base-font-size:16px;--send-btn-bg:#4485ca;--send-btn-text:#fff;--message-btn-bg:#333;--message-btn-text:#fff;--reset-btn-bg:#dc534c;--reset-btn-text:#fff;--settings-btn-bg:#707070;--settings-btn-text:#fff;--font-family:'Assistant',sans-serif}
html{font-size:var(--base-font-size)}
body.dark-mode{--bg-color:#121212;--text-color:#e0e0e0;--subtitle-color:#ccc;--card-bg:#2a2a2a;--panel-bg:#1e1e1e;--panel-border:#333;--btn-bg:#333;--btn-text:#e0e0e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:var(--font-family);background:var(--bg-color);color:var(--text-color);font-size:1rem;margin:0;padding:15px;text-align:center;transition:background .3s,color .3s}
textarea,input{user-select:text}
#connection-banner{display:none;position:fixed;top:0;left:0;right:0;background:#dc534c;color:#fff;font-weight:700;font-size:.875rem;padding:8px 12px;z-index:3000;text-align:center}
.header-container{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;flex-wrap:wrap;gap:10px}
.logo-main{font-size:2.15rem;font-weight:800;letter-spacing:-.5px;line-height:1.15;text-align:left}
.header-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.header-btn{padding:8px 16px;font-size:.8125rem;font-weight:700;border-radius:6px;cursor:pointer;border:none;font-family:var(--font-family);box-shadow:0 2px 4px rgba(0,0,0,.1)}
.btn-message-header{background:var(--message-btn-bg);color:var(--message-btn-text);border:1px solid var(--panel-border)}
.btn-complete-all{background:var(--reset-btn-bg);color:var(--reset-btn-text)}
.btn-settings-main{background:var(--settings-btn-bg);color:var(--settings-btn-text)}
.btn-save-edit{background:#5c9271;color:#fff;display:none}
.btn-discard-edit{background:#dc534c;color:#fff;display:none}
.btn-settings-editing{background:var(--settings-btn-bg);color:var(--settings-btn-text);display:none;padding:8px 10px}
body.editing-active .btn-message-header,body.editing-active .btn-complete-all,body.editing-active .btn-settings-main{display:none}
body.editing-active .btn-save-edit,body.editing-active .btn-discard-edit,body.editing-active .btn-settings-editing{display:inline-flex}
.section-title{text-align:left;max-width:1200px;margin:15px auto 8px;font-size:1.125rem;font-weight:700;border-bottom:2px solid var(--panel-border);padding-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.category-edit-controls,.add-btn-wrapper,.item-edit-bar,.add-section-row{display:none}
body.editing-active .category-edit-controls{display:flex;gap:4px;flex-wrap:wrap}
body.editing-active .add-btn-wrapper{display:inline-flex}
body.editing-active .item-edit-bar{display:flex}
body.editing-active .add-section-row{display:flex}
.cat-order-btn{background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--panel-border);border-radius:4px;padding:3px 9px;font-size:.75rem;cursor:pointer;font-family:var(--font-family)}
.cat-order-btn.danger{background:#dc534c;color:#fff;border-color:#dc534c}
.active-stack{display:flex;flex-direction:column;gap:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card-bg);padding:16px 20px;border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.15);border-left:8px solid #9e9e9e;text-align:left;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.card-info{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.card-room{font-size:1.875rem;font-weight:800}
.card-details{font-size:1.375rem;font-weight:700;color:var(--subtitle-color);background:rgba(0,0,0,.06);padding:6px 12px;border-radius:6px}
.timer-display{font-size:1.125rem;font-family:monospace;background:rgba(0,0,0,.1);padding:6px 10px;border-radius:6px;font-weight:700}
.control-panel{max-width:1200px;margin:15px auto 0;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:8px;padding:16px;text-align:left;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.builder-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.builder-btn-wrapper{display:inline-flex;flex-direction:column;min-width:90px;flex:1}
.builder-btn{padding:10px 14px;font-size:.875rem;font-weight:700;border-radius:6px;cursor:pointer;border:1px solid var(--panel-border);font-family:var(--font-family);width:100%;text-align:center}
.builder-btn.selected{filter:brightness(.82);border:2px solid rgba(255,255,255,.85)!important;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.3);transform:translateY(-1px)}
.item-edit-bar{justify-content:space-between;align-items:center;background:rgba(0,0,0,.08);padding:2px 6px;border-radius:0 0 6px 6px;margin-top:-2px}
.item-edit-btn{background:transparent;border:none;cursor:pointer;font-size:.75rem;padding:2px 5px;color:var(--text-color);font-weight:700}
.add-item-btn{padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:4px;border:2px dashed var(--subtitle-color);background:transparent;color:var(--subtitle-color);cursor:pointer;font-family:var(--font-family)}
.add-section-row{justify-content:center;margin-top:10px}
.panel-actions-container{display:flex;flex-direction:column;align-items:center;margin-top:15px;border-top:1px solid var(--panel-border);padding-top:15px;gap:8px}
.panel-footer-note{font-size:.75rem;color:var(--subtitle-color);font-style:italic}
.btn-send-dispatch{background:var(--send-btn-bg);color:var(--send-btn-text);border:none;padding:12px 32px;font-size:1rem;font-weight:800;border-radius:6px;cursor:pointer;font-family:var(--font-family);box-shadow:0 2px 5px rgba(0,0,0,.15)}
.btn-clear{background:#dc534c;color:#fff;border:none;padding:10px 20px;font-size:.9375rem;font-weight:700;border-radius:6px;cursor:pointer;font-family:var(--font-family)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--panel-bg);border:1px solid var(--panel-border);padding:24px;border-radius:12px;max-width:480px;width:90%;text-align:left;max-height:90vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.modal-title{font-size:1.25rem;font-weight:800;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}
.modal-group{margin-bottom:14px}
.modal-label{font-size:.8125rem;font-weight:700;color:var(--subtitle-color);margin-bottom:6px;display:block}
.modal-input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--panel-border);background:var(--bg-color);color:var(--text-color);font-family:var(--font-family);font-size:.875rem}
.color-input-row{display:flex;gap:8px;align-items:center}
.color-picker-input{width:45px;height:38px;border:none;border-radius:6px;cursor:pointer;background:none}
.hex-text-input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--panel-border);background:var(--bg-color);color:var(--text-color);font-family:monospace;font-size:.8125rem}
.default-reset-row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.small-action-btn{flex:1;font-size:.6875rem;padding:4px;background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--panel-border);border-radius:4px;cursor:pointer;font-family:var(--font-family);min-width:100px}
.preview-box-container{background:var(--bg-color);border:1px dashed var(--panel-border);padding:12px;border-radius:8px;margin-bottom:16px;text-align:center}
.preview-elements-wrap{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.preview-sample-btn{padding:8px 14px;border-radius:6px;font-weight:700;font-size:.8125rem;border:1px solid transparent}
.preview-sample-card{border-left:6px solid #69c2c8;background:var(--card-bg);padding:8px 12px;border-radius:6px;font-size:.8125rem;font-weight:700}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:10px;border-radius:6px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-family);font-size:.875rem}
.modal-btn-primary{background:#4485ca;color:#fff}
.modal-btn-danger{background:#dc534c;color:#fff}
.modal-btn-secondary{background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--panel-border)}
.checklist-group{margin-bottom:12px}
.checklist-label{display:flex;align-items:center;gap:8px;font-size:.875rem;margin-bottom:6px;cursor:pointer}
.settings-menu-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.settings-menu-item{width:100%;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--panel-border);background:var(--btn-bg);color:var(--btn-text);font-family:var(--font-family);font-size:.9375rem;font-weight:700;cursor:pointer}
.settings-menu-item.danger,.settings-menu-item.muted-active{background:#dc534c;color:#fff;border-color:#dc534c}
.modal-close-x{background:transparent;border:none;font-size:1.1rem;cursor:pointer;color:var(--subtitle-color)}
</style>
</head>
<body>
<div id="connection-banner"></div>

<div class="header-container">
  <div class="logo-main" id="app-title-display">Pegel Family Dental</div>
  <div class="header-controls">
    <button class="header-btn btn-message-header" onclick="openMessageModal()">Message</button>
    <button class="header-btn btn-complete-all" onclick="confirmClearTasks()">Complete All</button>
    <button class="header-btn btn-settings-main" onclick="openMainSettingsModal()">&#9881; Settings</button>
    <button class="header-btn btn-save-edit" onclick="saveEditMode()">Save &amp; Exit</button>
    <button class="header-btn btn-discard-edit" onclick="discardEditMode()">Discard Changes</button>
    <button class="header-btn btn-settings-editing" onclick="openMainSettingsModal()">&#9881;</button>
  </div>
</div>

<div id="active-section" style="display:none;">
  <div class="section-title">Active Requests</div>
  <div class="active-stack" id="active-grid"></div>
</div>

<div class="control-panel">
  <div id="categories-container"></div>
  <div class="add-section-row"><button class="add-item-btn" onclick="addCategory()">+ Add New Section</button></div>
  <div class="panel-actions-container">
    <button class="btn-send-dispatch" onclick="sendCustomRequest()">Submit</button>
    <div class="panel-footer-note">Select any combination of options and hit submit.</div>
  </div>
</div>

<!-- Settings hub -->
<div class="modal-overlay" id="main-settings-modal"><div class="modal-content">
  <div class="modal-title">Settings <button class="modal-close-x" onclick="closeModal('main-settings-modal')">&#10005;</button></div>
  <div class="settings-menu-list">
    <button class="settings-menu-item" id="menu-edit-mode-btn" onclick="closeModal('main-settings-modal');startEditMode()">Enter Edit Mode</button>
    <button class="settings-menu-item" onclick="closeModal('main-settings-modal');openSoundModal()">Sound Settings</button>
    <button class="settings-menu-item" onclick="closeModal('main-settings-modal');openGeneralSettingsModal()">Appearance &amp; Layout (Theme, Font, Colors)</button>
    <button class="settings-menu-item danger" onclick="resetAllSettings()"><div>Reset All Settings</div><div style="font-size:.75rem;font-weight:normal;opacity:.9">Restores default sections, buttons and colors for every device</div></button>
  </div>
  <div class="modal-actions"><button class="modal-btn modal-btn-secondary" onclick="closeModal('main-settings-modal')">Close</button></div>
</div></div>

<!-- Button edit -->
<div class="modal-overlay" id="button-edit-modal"><div class="modal-content">
  <div class="modal-title">Edit Button <span id="modal-edit-item-name" style="font-size:.875rem;color:var(--subtitle-color)"></span></div>
  <div class="preview-box-container"><div class="preview-elements-wrap">
    <button class="preview-sample-btn" id="preview-btn-element">Sample</button>
    <div class="preview-sample-card" id="preview-card-element">Room 1</div>
  </div></div>
  <div class="modal-group"><label class="modal-label">Button Name:</label><input type="text" id="modal-input-name" class="modal-input" oninput="updateModalPreview()"></div>
  <div class="modal-group"><label class="modal-label">Button Background Color:</label>
    <div class="color-input-row"><input type="color" id="modal-input-btn-color" class="color-picker-input" oninput="document.getElementById('modal-hex-btn-color').value=this.value;updateModalPreview()">
    <input type="text" id="modal-hex-btn-color" class="hex-text-input" oninput="updateModalPreview()" placeholder="Leave empty for default"></div>
    <div class="default-reset-row"><button class="small-action-btn" onclick="document.getElementById('modal-hex-btn-color').value='';updateModalPreview()">Use Theme Default</button></div></div>
  <div class="modal-group"><label class="modal-label">Active Card Accent Color:</label>
    <div class="color-input-row"><input type="color" id="modal-input-card-color" class="color-picker-input" oninput="document.getElementById('modal-hex-card-color').value=this.value;updateModalPreview()">
    <input type="text" id="modal-hex-card-color" class="hex-text-input" oninput="syncCardHex()" placeholder="#69c2c8"></div></div>
  <div style="margin-bottom:14px"><button class="modal-btn modal-btn-secondary" style="width:100%;padding:6px" onclick="matchColors()">Match Button &amp; Card Colors</button></div>
  <div class="modal-group"><label class="modal-label">Chime Sound (select to preview):</label><select id="modal-input-sound" class="modal-input" onchange="previewSelectedSound(this.value)"></select></div>
  <div class="modal-actions">
    <button class="modal-btn modal-btn-primary" onclick="saveButtonModal()">Save</button>
    <button class="modal-btn modal-btn-danger" onclick="deleteItemFromModal()">Delete</button>
    <button class="modal-btn modal-btn-secondary" onclick="closeButtonModal()">Cancel</button>
  </div>
</div></div>

<!-- Appearance -->
<div class="modal-overlay" id="general-settings-modal"><div class="modal-content">
  <div class="modal-title">Appearance &amp; Layout</div>
  <div class="modal-group"><label class="modal-label">Theme (this device):</label><button class="modal-btn modal-btn-secondary" style="width:100%" id="modal-theme-toggle-btn" onclick="toggleTheme()">Switch Theme</button></div>
  <div class="modal-group"><label class="modal-label">Font:</label><select id="modal-general-font" class="modal-input"></select></div>
  <div class="modal-group"><label class="modal-label">Title Text:</label><input type="text" id="modal-general-title" class="modal-input"></div>
  <div class="modal-group"><label class="modal-label">Base Font Size (this device): <span id="fontsize-value-display">20px</span></label>
    <input type="range" id="modal-general-fontsize" class="modal-input" min="14" max="36" step="1" style="padding:0" oninput="document.getElementById('fontsize-value-display').textContent=this.value+'px'"></div>
  <div id="color-fields"></div>
  <div class="modal-actions">
    <button class="modal-btn modal-btn-primary" onclick="saveGeneralSettings()">Apply</button>
    <button class="modal-btn modal-btn-secondary" onclick="closeModal('general-settings-modal')">Cancel</button>
  </div>
</div></div>

<!-- Sound -->
<div class="modal-overlay" id="sound-modal"><div class="modal-content">
  <div class="modal-title">Sound Settings (this device)</div>
  <div class="modal-group"><button class="settings-menu-item" id="menu-mute-btn" onclick="toggleGlobalMute()">Mute All Sounds</button></div>
  <div class="modal-group"><label class="modal-label">Master Volume: <span id="volume-value-display">1000%</span></label>
    <input type="range" id="modal-volume-slider" min="0.5" max="10" step="0.1" style="width:100%" oninput="updateVolumeDisplay(this.value);previewVolumeChange()" onchange="saveVolumeSetting(this.value)"></div>
  <div class="modal-group"><label class="checklist-label"><input type="checkbox" id="modal-completion-sound-chk" onchange="toggleCompletionSoundSetting()"> Play a sound when marking a card complete</label></div>
  <div class="modal-group"><label class="modal-label">Message Button Sound (shared):</label><select id="modal-message-sound" class="modal-input" onchange="previewSelectedSound(this.value);saveMessageSoundSetting()"></select></div>
  <p style="font-size:.8125rem;color:var(--subtitle-color);margin-top:0">Uncheck any item to silence its alert on this device only.</p>
  <div id="sound-modal-groups"></div>
  <button class="modal-btn modal-btn-primary" style="width:100%;margin-top:15px" onclick="closeSoundModal()">Save &amp; Close</button>
</div></div>

<!-- Message -->
<div class="modal-overlay" id="message-modal"><div class="modal-content">
  <div class="modal-title">Send a Message <button class="modal-close-x" onclick="closeModal('message-modal')">&#10005;</button></div>
  <div class="modal-group"><textarea id="message-input-textarea" class="modal-input" rows="4" placeholder="Type a message to pin above all active cards..."></textarea></div>
  <div class="modal-actions">
    <button class="modal-btn modal-btn-primary" onclick="submitMessage()">Submit</button>
    <button class="modal-btn modal-btn-secondary" onclick="closeModal('message-modal')">Cancel</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCNlZHFSK_QE7R3yB0Uiuk_Gfi_d2tkawc",
  authDomain: "pegel-family-dental-intercom.firebaseapp.com",
  projectId: "pegel-family-dental-intercom",
  appId: "1:153502104371:web:8f02a8ae3a9d66016bdc46"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

const MESSAGE_ROOM_KEY = "__MESSAGE__";
const MAX_VOLUME = 10;
const DEFAULT_FONT_SIZE = '20px';
const SOUND_CODES = ["GAF","GBG","CAF","CEE","GGG","AF","FF","EEC","DD","GC","CG","G","D"];
const DEFAULT_CARD_COLORS = ["#69c2c8","#cab0ed","#cde293","#8eb7f7"];
const FONTS = {'Assistant':'sans-serif','Roboto':'sans-serif','Open Sans':'sans-serif','Inter':'sans-serif','Montserrat':'sans-serif','Lato':'sans-serif','Nunito':'sans-serif','Quicksand':'sans-serif','Outfit':'sans-serif','Lexend Deca':'sans-serif','Roboto Mono':'monospace','Playfair Display':'serif','Roboto Slab':'serif','Merriweather':'serif','Comic Relief':'cursive'};
const NOTE_FREQS = {'C':523.25,'C#':554.37,'D':587.33,'D#':622.25,'E':659.25,'F':698.46,'F#':739.99,'G':783.99,'G#':830.61,'A':880,'A#':932.33,'B':987.77};
const COLOR_FIELDS = [
  ['messageCardColor','Message Card Color','#cab0ed'],
  ['bg','Custom Background Color (blank = automatic)',''],
  ['sendBg','Submit Button Color','#4485ca'],
  ['sendText','Submit Button Text Color','#ffffff'],
  ['msgBtnBg','Message Button Color','#333333'],
  ['resetBtnBg','Complete All Button Color','#dc534c'],
  ['settingsBtnBg','Settings Button Color','#707070']
];
const DEFAULT_CATEGORIES = () => ([
  {key:'pers',title:'',items:["Dr. Josh","Dr. Terry","Laura","Christy","Norma","Other"]},
  {key:'status',title:'',items:["Pt. Ready","Pt. Here","Perio Charting","Exam","Pt. Late","Help Front Desk"]},
  {key:'room',title:'',items:["Hyg1","Hyg2","Op3","Op4","Hyg5","Op6","Op7","Op8"]}
]);
const DEFAULT_GENERAL = () => ({bg:'',fontFamily:'Assistant',sendBg:'#4485ca',sendText:'#ffffff',msgBtnBg:'#333333',resetBtnBg:'#dc534c',settingsBtnBg:'#707070',titleText:'Pegel Family Dental',messageCardColor:'#cab0ed',messageSound:'ALARM_1'});
const DEFAULT_STYLES = {
  "Dr. Josh":{sound:"GAF",card:"#3f98f8"},"Dr. Terry":{sound:"CEE",card:"#e85454"},"Norma":{sound:"GGG",card:"#c58adb"},
  "Christy":{sound:"FF",card:"#f99adb"},"Laura":{sound:"AF",card:"#6ebec4"},"Other":{sound:"DD",card:"#8ebf45"},
  "Pt. Ready":{sound:"CG",card:"#3abb8a"},"Pt. Here":{sound:"D",card:"#7be000"},"Perio Charting":{sound:"CAF",card:"#a536d9"},
  "Exam":{sound:"GBG",card:"#e0c410"},"Pt. Late":{sound:"G",card:"#ff961f"},"Help Front Desk":{sound:"ALARM_2",card:"#ff0000"}
};

// ---------- helpers ----------
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v===null?fb:JSON.parse(v);}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function $(id){return document.getElementById(id);}
function closeModal(id){$(id).style.display='none';}
function openModal(id){$(id).style.display='flex';}

// ---------- state ----------
let categories = lsGet('dental_categories', null) || DEFAULT_CATEGORIES();
let buttonStyles = lsGet('dental_btn_styles', {});
let sharedGeneral = Object.assign(DEFAULT_GENERAL(), lsGet('dental_shared_general', {}));
let deviceSettings = Object.assign({fontSize:DEFAULT_FONT_SIZE,volume:MAX_VOLUME,completionSound:false}, lsGet('dental_device_settings', {}));
let savedConfig = lsGet('dental_sound_config', null) || {};
let globallyMuted = lsGet('dental_global_muted', false);
let selections = {};
let stagingCategories = clone(categories), stagingButtonStyles = clone(buttonStyles);
let isEditingMode = false, currentEditingItem = null;
let audioCtx = null, audioUnlocked = false;
let knownTaskIds = new Set(), firstLoad = true, cachedData = [], lastRenderedSignature = null;
let lastAppliedJson = null, seeding = false, settingsLoaded = false;
let isDark = lsGet('dental_dark_mode', true);
if (isDark) document.body.classList.add('dark-mode');

function generalSettings(){return Object.assign({}, sharedGeneral, deviceSettings);}
function ensureDefaultStyles(){
  categories.forEach(cat => cat.items.forEach((item,i) => {
    const d = DEFAULT_STYLES[item];
    const s = buttonStyles[item] = buttonStyles[item] || {};
    if (!s.sound) s.sound = d ? d.sound : SOUND_CODES[i % SOUND_CODES.length];

// ---------- audio ----------
function unlockAudio(){
  if (audioUnlocked) { if (audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioUnlocked = true; } catch(e){}
}
document.addEventListener('click', unlockAudio); document.addEventListener('touchstart', unlockAudio);
let masterCompressor = null;
function getMasterChain(){
  if (!masterCompressor || masterCompressor.context !== audioCtx) {
    masterCompressor = audioCtx.createDynamicsCompressor();
    const n = audioCtx.currentTime;
    masterCompressor.threshold.setValueAtTime(-28,n); masterCompressor.knee.setValueAtTime(6,n); masterCompressor.ratio.setValueAtTime(16,n);
    masterCompressor.attack.setValueAtTime(.002,n); masterCompressor.release.setValueAtTime(.12,n);
    masterCompressor.connect(audioCtx.destination);
  }
  return masterCompressor;
}
function makeDistortionCurve(amount){
  const c = new Float32Array(256);
  for (let i=0;i<256;i++){ const x=(i*2)/256-1; c[i]=((3+amount)*x*20*Math.PI/180)/(Math.PI+amount*Math.abs(x)); }
  return c;
}
function playTone(freq, time, dur, volOverride){
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), shaper = audioCtx.createWaveShaper();
  osc.type = 'sine'; osc.frequency.setValueAtTime(freq, time);
  const m = volOverride !== undefined ? volOverride : (deviceSettings.volume || MAX_VOLUME);
  shaper.curve = makeDistortionCurve(Math.min(Math.max(0, m-1.6)*10, 60)); shaper.oversample = '4x';
  gain.gain.setValueAtTime(.15*Math.min(m,1.6), time); gain.gain.exponentialRampToValueAtTime(.0001, time+dur);
  osc.connect(shaper); shaper.connect(gain); gain.connect(getMasterChain()); osc.start(time); osc.stop(time+dur);
}
function playNoteSequence(code){
  try {
    if (!audioCtx) return; if (audioCtx.state==='suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (code==='ALARM_1'||code==='ALARM') { playTone(783.99, now, .9); return; }
    if (code==='ALARM_2') { playTone(783.99, now, .9); playTone(783.99, now+1, .9); return; }
    code.split('').forEach((l, i) => playTone(NOTE_FREQS[l] || 440, now + i*.16, .14));
  } catch(e){}
}
function playChosenSound(s){ if (!s || s==='none') return; playNoteSequence(s); }
function previewSelectedSound(s){ unlockAudio(); playChosenSound(s); }
function playCompletionTone(){
  if (globallyMuted || !audioUnlocked || !audioCtx || deviceSettings.completionSound !== true) return;
  try { const n = audioCtx.currentTime; playTone(783.99, n, .1); playTone(1046.5, n+.12, .18); } catch(e){}
}
function isSubscribed(item, skipRoom){
  for (const cat of categories) {
    if (skipRoom && cat.key==='room') continue;
    if (cat.items.includes(item)) return (savedConfig[cat.key] || []).includes(item);
  }
  return true;
}
function evaluateAndPlaySoundBatch(entries){
  if (globallyMuted || !audioUnlocked || !audioCtx || !entries || !entries.length) return;
  for (const e of entries) {
    const room = e.room || '';
    const persList = (e.personnel || '').split(',').map(s=>s.trim()).filter(s=>s && s!=='None');
    const statusList = (e.status || '').split(',').map(s=>s.trim()).filter(Boolean);
    if (statusList.includes("Help Front Desk") && isSubscribed("Help Front Desk", true)) {
      const st = buttonStyles["Help Front Desk"]; playChosenSound(st && st.sound && st.sound!=='none' ? st.sound : 'ALARM_2'); return;
    }
    for (const p of persList) {
      if (isSubscribed(p, true)) { const st = buttonStyles[p]; playChosenSound(st && st.sound && st.sound!=='none' ? st.sound : 'GAF'); return; }
    }
    if (room) {
      if (!(savedConfig['room'] || []).includes(room)) continue;
      if (statusList.some(s => isSubscribed(s, true))) {
        for (const s of statusList) { const st = buttonStyles[s]; if (st && st.sound && st.sound!=='none') { playChosenSound(st.sound); return; } }
        const rs = buttonStyles[room]; playNoteSequence(rs && rs.sound && rs.sound!=='none' ? rs.sound : 'CEE'); return;
      }
    }
  }
}

// ---------- submitting ----------
function generateTaskId(){ return 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); }
function sendCustomRequest(){
  if (!categories.some(c => (selections[c.key] || []).length > 0)) { alert("Please select at least one option."); return; }
  const roomCat = categories.find(c => c.key === 'room');
  const roomTargets = roomCat ? [...(selections[roomCat.key] || [])] : [];
  const nonRoomCats = categories.filter(c => c.key !== 'room');
  let personnelStr = "None", statusItems = [], allNonRoom = [];
  nonRoomCats.forEach((cat, i) => {
    const sel = selections[cat.key] || [];
    sel.forEach(x => allNonRoom.push(x));
    if (i === 0) { if (sel.length) personnelStr = sel.join(", "); } else sel.forEach(x => statusItems.push(x));
  });
  const statusStr = statusItems.join(", ");
  const timestamp = new Date().toISOString();

  // Clear the selected buttons immediately so they always reset, whatever happens next.
  resetSelections(); renderControlPanel();

  const soundEntries = roomTargets.length ? roomTargets.map(r => ({room:r,personnel:personnelStr,status:statusStr})) : [{room:'',personnel:personnelStr,status:statusStr}];
  unlockAudio(); evaluateAndPlaySoundBatch(soundEntries);
  if (roomTargets.length) roomTargets.forEach(r => createTask(r, personnelStr, statusStr, timestamp));
  else createTask(allNonRoom.length ? allNonRoom[0] : "Alert", personnelStr, statusStr, timestamp);
}
function createTask(room, personnel, status, timestamp){
  const id = generateTaskId();

  db.collection('tasks').doc(id).set({room:room, personnel:personnel, status:status, timestamp:timestamp || new Date().toISOString(), createdAt:firebase.firestore.FieldValue.serverTimestamp()})
    .catch(err => { console.error(err); alert("That request could not be sent: " + err.message); });
}

function confirmClearTasks(){
  if (!confirm('Mark ALL active requests as complete?')) return;
  db.collection('tasks').get().then(snap => {
    const docs = snap.docs, jobs = [];
    for (let i=0;i<docs.length;i+=400) { const b = db.batch(); docs.slice(i,i+400).forEach(d => b.delete(d.ref)); jobs.push(b.commit()); }
    return Promise.all(jobs);
  }).catch(err => alert("Failed to complete all: " + err.message));
}

function handleTasksSnapshot(snap){
  hideBanner();

  snap.docChanges().forEach(ch => {
    if (ch.type !== 'added') return;
    const id = ch.doc.id; if (knownTaskIds.has(id)) return;
    knownTaskIds.add(id); if (firstLoad) return;
    const d = ch.doc.data();
    if (d.room === MESSAGE_ROOM_KEY) newlyMsgs.push(d); else newly.push({room:d.room||'',personnel:d.personnel||'',status:d.status||'',timestamp:d.timestamp||''});
  });
  firstLoad = false;
  if (newlyMsgs.length) { unlockAudio(); newlyMsgs.forEach(() => playChosenSound(sharedGeneral.messageSound || 'ALARM_1')); }
  if (newly.length) {
    unlockAudio(); const groups = {};
    newly.forEach(e => { (groups[e.timestamp] = groups[e.timestamp] || []).push(e); });
    Object.keys(groups).forEach(k => evaluateAndPlaySoundBatch(groups[k]));
  }
  cachedData = snap.docs.map(doc => { const d = doc.data(); return [doc.id, d.room||'', d.personnel||'', d.status||'', d.timestamp||'']; });
  updateUI(cachedData);
}
function handleListenerError(err){
  console.error("Live connection error:", err);
  if (err && err.code === 'permission-denied') showBanner('The database refused access. Publish the rules from firestore.rules in the Firebase console.');
  else showBanner('Connection problem: ' + (err && err.message ? err.message : 'unknown error'));
}
function getCardColor(personnel, status, room){
  if (room === MESSAGE_ROOM_KEY) return sharedGeneral.messageCardColor || '#cab0ed';
  const pl = personnel.split(',').map(s=>s.trim()), sl = status.split(',').map(s=>s.trim());
  if (sl.includes("Help Front Desk") && pl[0] !== "None" && buttonStyles["Help Front Desk"] && buttonStyles["Help Front Desk"].card) return buttonStyles["Help Front Desk"].card;
  for (const it of [...pl, ...sl, room]) if (buttonStyles[it] && buttonStyles[it].card) return buttonStyles[it].card;
  return "#69c2c8";
}
function buildDetailsText(personnel, status){
  const p = (personnel||'').split(',').map(s=>s.trim()).filter(s=>s && s!=='None');
  const s = (status||'').split(',').map(x=>x.trim()).filter(Boolean);
  const parts = []; if (p.length) parts.push(p.join(', ')); if (s.length) parts.push(s.join(', '));
  return parts.length ? parts.join(' \u2022 ') : 'Request';
}
function computeElapsedText(t){
  const start = new Date(t).getTime(); if (!t || isNaN(start)) return "00:00";
  const d = Math.max(0, Math.floor((Date.now()-start)/1000)), m = Math.floor(d/60), s = d%60;
  return (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
}
function updateUI(data){
  const sorted = [...data].sort((a,b) => {
    const am = a[1]===MESSAGE_ROOM_KEY, bm = b[1]===MESSAGE_ROOM_KEY;
    if (am !== bm) return am ? -1 : 1;
    return (a[4] ? new Date(a[4]).getTime() : 0) - (b[4] ? new Date(b[4]).getTime() : 0);
  });
  const section = $('active-section');
  const sig = JSON.stringify(sorted) + JSON.stringify(buttonStyles) + sharedGeneral.messageCardColor;
  section.style.display = sorted.length ? 'block' : 'none';
  if (sig === lastRenderedSignature) return;
  lastRenderedSignature = sig;
  $('active-grid').innerHTML = sorted.map(r => {
    const id = r[0], room = r[1], pers = r[2], stat = r[3], ts = r[4], isMsg = room === MESSAGE_ROOM_KEY;
    const info = isMsg ? `<div class="card-details">${esc(pers)}</div>`
      : `<div class="card-room">${esc(room)}</div><div class="card-details">${esc(buildDetailsText(pers, stat))}</div><div class="timer-display" data-time="${esc(ts)}">${computeElapsedText(ts)}</div>`;
    return `<div class="card" style="border-left-color:${esc(getCardColor(pers, stat, room))}"><div class="card-info">${info}</div><button class="btn-clear" onclick="handleCardComplete('${esc(id)}')">Mark Complete</button></div>`;
  }).join('');
}
setInterval(() => document.querySelectorAll('.timer-display').forEach(el => el.textContent = computeElapsedText(el.getAttribute('data-time'))), 1000);

// ---------- start ----------
ensureDefaultStyles(); syncSoundConfig(); resetSelections();
stagingCategories = clone(categories); stagingButtonStyles = clone(buttonStyles);
applyGeneralSettings(); updateThemeButtonText(); updateMuteButtonText(); renderControlPanel();
db.collection('tasks').onSnapshot(handleTasksSnapshot, handleListenerError);
db.collection('settings').doc('shared').onSnapshot(handleSettingsSnapshot, handleListenerError);
</script>
